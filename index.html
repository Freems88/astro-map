<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where the ASTROs are</title>
<meta name="description" content="Live map of Toronto Bike Share's ASTRO pilot e-bikes.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFF; --ink:#121820; --ink-2:#57646F; --ink-3:#8A97A3;
  --line:#D6DDE4; --accent:#0A63C9; --accent-soft:#DCEAFB; --amber:#9A6100;
  --bad:#B3261E;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D1015; --surface:#161B22; --ink:#E6ECF3; --ink-2:#93A1B0; --ink-3:#6B7887;
  --line:#252C36; --accent:#5AA7FF; --accent-soft:#14283F; --amber:#E2A63F;
  --bad:#F2B8B5;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif; -webkit-font-smoothing:antialiased;
}
#app{display:flex;height:100%}
#side{width:370px;flex:none;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line)}
#map{flex:1;min-width:0;background:var(--bg)}
header{padding:16px 18px;border-bottom:1px solid var(--line)}
.eyebrow{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
h1{font:700 23px/1.05 Archivo,system-ui,sans-serif;letter-spacing:-.02em;margin:0}
.tally{display:flex;align-items:baseline;gap:8px;margin-top:9px}
.big{font:700 32px/1 Archivo,sans-serif;color:var(--accent);font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--ink-2)}
.bar{display:flex;gap:8px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
button{
  font:500 12.5px/1 "IBM Plex Sans",sans-serif;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:3px;padding:8px 11px;cursor:pointer;
}
button:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.age{font:400 12px/1 "IBM Plex Mono",monospace;color:var(--ink-3);margin-left:auto}
.note{margin:0;padding:10px 18px;border-bottom:1px solid var(--line);font-size:12px;
  line-height:1.5;color:var(--ink-3);background:var(--bg)}
.legend{display:block;margin-bottom:5px;color:var(--ink-2);font-weight:500}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 5px 0 0;
  vertical-align:baseline;border:2px solid}
.sw.hot{background:#5AA7FF;border-color:#0A63C9}
.sw.cold{background:#C3CDD7;border-color:#8A97A3;margin-left:12px}
.stn.dim .cnum{background:var(--ink-3)}
#list{flex:1;overflow-y:auto}
.stn{display:flex;gap:11px;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.stn:hover,.stn.on{background:var(--accent-soft)}
.cnum{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
  font:600 12px/26px "IBM Plex Mono",monospace;text-align:center}
.sb{min-width:0;flex:1}
.snm{font-weight:600;font-size:14.5px}
.smeta{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.bolt{color:var(--amber)}
.dist{font:500 12px/1 "IBM Plex Mono",monospace;color:var(--accent);white-space:nowrap;align-self:center}
.msg{padding:22px 18px;color:var(--ink-2);font-size:14px}
.msg.err{color:var(--bad)}
.leaflet-popup-content{font:14px/1.45 "IBM Plex Sans",sans-serif}
@media(max-width:820px){
  #app{flex-direction:column}
  #side{width:100%;height:52%;border-right:none;border-bottom:1px solid var(--line)}
  #map{height:48%}
}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header>
      <p class="eyebrow">Toronto Bike Share &middot; pilot fleet</p>
      <h1 id="title">Where the ASTROs are</h1>
      <div class="tally"><span class="big" id="nbikes">&mdash;</span>
        <span class="sub" id="nstn">loading&hellip;</span></div>
    </header>
    <div class="bar">
      <button id="refresh">Refresh</button>
      <button id="near" aria-pressed="false">Nearest me</button>
      <button id="chg" aria-pressed="false">Charging docks</button>
      <span class="age" id="age"></span>
    </div>
    <p class="note">
      <span class="legend"><i class="sw hot"></i>charging dock <i class="sw cold"></i>plain dock</span>
      Battery level isn&rsquo;t in the public feed &mdash; nobody can show it. A bike on a
      charging dock has likely been topping up, but one that just arrived may still be low.
    </p>
    <div id="list"><p class="msg">Fetching live data&hellip;</p></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const BASE = 'https://toronto.publicbikesystem.net/customer/gbfs/v2/en';
const TYPE = new URLSearchParams(location.search).get('type') || 'ASTRO';
const REFRESH_MS = 60000;

document.title = `Where the ${TYPE}s are`;
document.getElementById('title').textContent = `Where the ${TYPE}s are`;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.toLowerCase().split(/\s+/).join(' ');

let info = null, rows = [], fetchedAt = null, here = null, markers = {}, chgOnly = false;

const map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
map.setView([43.6532, -79.3832], 12);

const getJSON = async url => {
  const r = await fetch(url, {cache:'no-store'});
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return (await r.json()).data;
};

function km(a, b){                                   // haversine, kilometres
  const R = 6371, t = x => x * Math.PI / 180;
  const dLat = t(b[0]-a[0]), dLon = t(b[1]-a[1]);
  const s = Math.sin(dLat/2)**2 +
            Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

async function load(){
  try {
    if (!info){
      const d = await getJSON(`${BASE}/station_information`);
      info = Object.fromEntries(d.stations.map(s => [s.station_id, s]));
    }
    const status = await getJSON(`${BASE}/station_status`);
    fetchedAt = new Date();

    rows = [];
    for (const s of status.stations){
      const n = (s.vehicle_types_available || [])
        .filter(v => v.vehicle_type_id === TYPE)
        .reduce((a, v) => a + (v.count || 0), 0);
      if (n <= 0) continue;
      const i = info[s.station_id];
      if (!i || i.lat == null || i.lon == null) continue;
      const addr = i.address || '';
      rows.push({
        id: s.station_id, name: i.name || '', lat: i.lat, lon: i.lon, n,
        addr: norm(addr) === norm(i.name || '') ? '' : addr.trim(),
        charging: !!i.is_charging_station,
        docks: s.num_docks_available || 0,
        renting: !!s.is_renting
      });
    }
    render();
  } catch (e){
    $('list').innerHTML =
      `<p class="msg err">Couldn't reach the bike share feed.<br>${esc(e.message)}` +
      `<br><br>It's a public feed with no key, so this is usually a temporary outage &mdash; try Refresh.</p>`;
  }
}

function render(){
  if (here) rows.forEach(r => r.d = km(here, [r.lat, r.lon]));
  const view = chgOnly ? rows.filter(r => r.charging) : rows;
  view.sort(here ? (a,b) => a.d - b.d : (a,b) => b.n - a.n || a.name.localeCompare(b.name));

  const total = view.reduce((a, r) => a + r.n, 0);
  const onChg = rows.filter(r => r.charging).reduce((a, r) => a + r.n, 0);
  $('nbikes').textContent = total;
  $('nstn').textContent = chgOnly
    ? `on charging docks, of ${rows.reduce((a,r) => a + r.n, 0)} total`
    : `bikes at ${view.length} station${view.length === 1 ? '' : 's'} · ${onChg} charging`;

  Object.values(markers).forEach(m => m.remove());
  markers = {};
  view.forEach(r => {
    // No battery data exists in the feed, so charging-dock status is the only
    // charge signal available: saturated = likely topped up, muted = unknown.
    const style = !r.renting ? {color:'#B3261E', fillColor:'#F2B8B5', fillOpacity:.85}
                : r.charging ? {color:'#0A63C9', fillColor:'#5AA7FF', fillOpacity:.9}
                             : {color:'#8A97A3', fillColor:'#C3CDD7', fillOpacity:.75};
    const m = L.circleMarker([r.lat, r.lon], {
      radius: 8 + Math.min(r.n, 5) * 2.2, weight: 2, ...style
    }).addTo(map);
    m.bindPopup(
      `<b>${esc(r.name)}</b><br>${r.addr ? esc(r.addr)+'<br>' : ''}` +
      `<b>${r.n}</b> ${esc(TYPE)} &middot; ${r.docks} dock${r.docks===1?'':'s'} free<br>` +
      (r.charging ? '&#9889; charging dock &mdash; likely topped up<br>'
                  : '<span style="color:#8A97A3">plain dock &mdash; charge unknown</span><br>') +
      (r.renting ? '' : '<span style="color:#B3261E">not renting</span><br>') +
      `<a href="https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lon}" ` +
      `target="_blank" rel="noopener">Directions &rarr;</a>`);
    markers[r.id] = m;
  });

  // Leaflet sizes itself at init; if the container was still collapsing into
  // its flex row then, fitBounds solves against a zero-size box and lands on
  // world zoom. Re-measure first.
  if (view.length){
    map.invalidateSize();
    map.fitBounds(L.featureGroup(Object.values(markers)).getBounds().pad(.08));
  }

  $('list').innerHTML = view.length ? view.map(r => `
    <div class="stn${r.charging ? '' : ' dim'}" data-id="${r.id}">
      <div class="cnum">${r.n}</div>
      <div class="sb">
        <div class="snm">${esc(r.name)}</div>
        ${r.addr ? `<div class="smeta">${esc(r.addr)}</div>` : ''}
        <div class="smeta">${r.docks} dock${r.docks===1?'':'s'} free
          ${r.charging ? '<span class="bolt">&middot; &#9889; charging</span>' : ''}
          ${r.renting ? '' : '<span style="color:var(--bad)">&middot; not renting</span>'}</div>
      </div>
      ${r.d != null ? `<div class="dist">${r.d < 1 ? Math.round(r.d*1000)+' m' : r.d.toFixed(1)+' km'}</div>` : ''}
    </div>`).join('')
    : chgOnly
      ? `<p class="msg">No ${esc(TYPE)} bikes on a charging dock right now.
         ${rows.length} are sitting at plain docks &mdash; switch the filter off to see them.</p>`
      : `<p class="msg">No ${esc(TYPE)} bikes docked anywhere right now.</p>`;

  document.querySelectorAll('.stn').forEach(el => el.addEventListener('click', () => {
    const m = markers[el.dataset.id];
    map.setView(m.getLatLng(), 16); m.openPopup();
  }));

  tickAge();
}

function tickAge(){
  if (!fetchedAt) return;
  const s = Math.round((Date.now() - fetchedAt) / 1000);
  $('age').textContent = s < 60 ? `updated ${s}s ago`
    : `updated ${Math.round(s/60)}m ago`;
}

$('refresh').addEventListener('click', load);

$('chg').addEventListener('click', e => {
  chgOnly = !chgOnly;
  e.currentTarget.setAttribute('aria-pressed', String(chgOnly));
  render();
});

$('near').addEventListener('click', e => {
  const btn = e.currentTarget;
  if (btn.getAttribute('aria-pressed') === 'true'){
    here = null; rows.forEach(r => delete r.d);
    btn.setAttribute('aria-pressed', 'false'); render(); return;
  }
  if (!navigator.geolocation) return alert('This browser has no location support.');
  btn.textContent = 'Locating…';
  navigator.geolocation.getCurrentPosition(
    p => {
      here = [p.coords.latitude, p.coords.longitude];
      L.circleMarker(here, {radius:7, color:'#1B7F3B', fillColor:'#57C77E',
        fillOpacity:.9, weight:2}).addTo(map).bindPopup('You are here');
      btn.textContent = 'Nearest me'; btn.setAttribute('aria-pressed', 'true');
      render();
    },
    err => { btn.textContent = 'Nearest me'; alert('Location unavailable: ' + err.message); },
    {enableHighAccuracy:true, timeout:10000}
  );
});

load();
setInterval(load, REFRESH_MS);
setInterval(tickAge, 15000);
</script>
</body>
</html>
